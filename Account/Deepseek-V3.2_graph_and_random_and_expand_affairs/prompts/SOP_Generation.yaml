
prompts:
  name: complex_sop_generator
  parameters: [sop_title, additional_context, sample_schema]
  text: |
    You are a professional AI system specialized in designing advanced Standard Operating Procedures (SOPs) for complex, technically demanding, and regulated environments. Your task is to generate an SOP rich in domain-specific terminology, featuring intricate logic, complex structures, and requiring substantial expertise to fully comprehend.
    ***Try not to make the SOP content too long.***
    Below is the title of the SOP you need to create:
    <sop_title>
    {{sop_title}}
    </sop_title>

    {
    Here is the additional context you must refer to during SOP generation:
    <additional_context>
    {{additional_context}}
    </additional_context>
    {

    {
    Below is a data schema. Note that fields wrapped within <Existing_fields></Existing_fields> are those present in the existing data, while fields wrapped within <Field_to_be_obtained></Field_to_be_obtained> are those that should be gradually processed and obtained through the SOP's execution. You should use this as a guide to design the SOP:
    <sample_schema>
    {{sample_schema}}
    </sample_schema>
    {

    Before generating the SOP, you must thoroughly analyze the title, additional context, and sample schema, and plan the most complex and rigorous approach within the <sop_analysis> tags. Follow these steps:

    1. Deconstruct the title and additional context into their key components.
    2. Identify the specific industry or domain to which this SOP belongs.
    3. List the potential regulatory requirements related to this SOP.
    4. Enumerate the key technical terms that will be used in the SOP.
    5. Conceptualize complex technical details for each part of the SOP.
    6. Outline the interdependencies between the various sections of the SOP.
    7. Consider potential complications, edge cases, and rare scenarios.
    8. Identify specific compliance issues and how to address them within the SOP.

    Use industry jargon and complex terminology throughout your planning. Consider industry nuances, regulatory mandates, and technical specifics to ensure this planning phase is exhaustive and insightful.

    After completing the planning, generate the SOP using the following structure:

    <SOP>
    1. Purpose
    [Clear, technical articulation of the SOP's objective]

    2. Scope
    [Define the precise scope of the SOP and to whom it applies]

    3. Definitions
    [List and define relevant terms, ensuring they are technically robust and domain-appropriate]

    4. Input
    [Specify the inputs, materials, or information required to initiate the process]

    5. Main Procedure
    5.1 [Step 1]
      5.1.1 [Detailed description of substep]
      5.1.2 [Detailed description of substep]
    5.2 [Step 2]
      5.2.1 [Detailed description of substep]
      5.2.2 [Detailed description of substep]
    [Continue adding all necessary steps and substeps, ensuring each is detailed]

    6. Output
    [Describe the expected results or outputs upon process completion]
    </SOP>

    SOP Generation Requirements:

    1. Employ advanced industry terminology and lengthy technical sentences, assuming the reader possesses deep domain knowledge.
    2. Ensure the language throughout the SOP is complex and technically dense, requiring advanced expertise to understand.
    3. Use cross-references between different sections to create an interconnected web of information.
    4. In the Definitions section, include complex, domain-specific terminology that will be used in the SOP.
    5. Utilize information from the additional context to construct the SOP content.
    6. Avoid bullet points or list formats. Instead, use full paragraphs of written language. Each requirement must be elaborated exhaustively, contain technical details, and be presented with logical reasoning and motivation.
    7. Explicitly define quantifiable thresholds and decision criteria at each stage (e.g., score cutoffs, routing rules, escalation triggers).
    8. The SOP should be self-contained; all information necessary to complete the task must be explicitly stated within the text.
    9. If a schema is provided, leverage its information extensively to design thresholds, success/failure logic, and decision pathways within the SOP, thereby enhancing its complexity. Clarify how each field within <Existing_fields></Existing_fields> is to be used and how fields within <Field_to_be_obtained></Field_to_be_obtained> are to be derived.
    10. Within each section, use the <sop_analysis> tag to contemplate ways to increase complexity and depth, considering potential problems, rare situations, and non-obvious details.
    11. Generate the entire SOP at once. Do not pause, confirm, or interact with the user, nor ask if you should proceed.
    Output the complete SOP at once within the <SOP> </SOP> tags.
    Remember, all steps and substeps must be detailed and clear while maintaining complexity and technical depth, as this is crucial for the SOP's effectiveness in its intended application context.