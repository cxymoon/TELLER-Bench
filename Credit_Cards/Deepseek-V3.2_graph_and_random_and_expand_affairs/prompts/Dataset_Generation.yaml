#     ***注意，你生成的数据集中每条数据格式应该完全相同，每条数据应该用[]包裹，其中的每个字段的值要符合schema中的结构，且各用一个''包裹，中间用英文逗号分隔。**每条数据中的输入输出字段绝不能是schema中所没有的**，只需合成schema中<Existing_fields></Existing_fields>包裹的字段值，<Field_to_be_obtained></Field_to_be_obtained>包裹的字段只需写出键，值留空。***
#     1. **理解分析**：仔细分析 SOP，识别所有决策点、校验步骤、升级条件与分类规则。依据这些确定数据集中必须出现的字段及其可能取值。
