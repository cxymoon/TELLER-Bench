#     3. **案例多样性**：
#        - 包括有效和无效示例；
#        - 涵盖边界条件、极限值和违反政策的情况；
#        - 确保 SOP 中的每一步逻辑在某些行中体现。
#     4. **数据格式**：
#        - 数据仅输出在 `<data></data>` 标签中；
#        - 不要在 `<data>` 块外添加额外注释或说明。
#     5. **验证要求**：
#        - 所有行非空；
#        - 所有列完整且值格式正确；
#        - 无未闭合字符串，无字符串内部换行；
#        - 字段值间一致（如仅在满足条件时升级字段为 True）。
#     6. 生成至少 `{{n_samples}}` 行有效记录，覆盖 SOP 定义的全量条件。
#     7. 一次性完整生成数据，不打断、不确认、不交互。
#     8. 不添加说明性文本、占位符或提示生成继续的消息。只输出 `<data>` 块中完整数据。
